<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><style>
:root{--peach1:#FBEDE7;--peach2:#F6DCCB;--gold:#C9A063;--gold-d:#A87E42;--cocoa:#4A3527;--ink:#3A2A1E}
*{margin:0;padding:0;box-sizing:border-box}
body{width:790px;min-height:1404px;background:radial-gradient(120% 80% at 50% 0%,#fff7f0 0%,var(--peach1) 46%,var(--peach2) 100%);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:790px;height:1404px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 0}
.brand{font-size:25px;letter-spacing:15px;font-weight:300;color:var(--ink)}
.brand b{font-weight:800}
.pname{font-size:60px;font-weight:800;letter-spacing:7px;color:var(--cocoa);line-height:1.12;margin-top:26px}
.pen{font-size:15px;letter-spacing:5px;color:var(--gold-d);margin-top:22px;text-transform:uppercase;font-weight:500}
.tag{font-size:16px;color:#8a6a54;letter-spacing:2px;margin-top:22px}
.bwrap{margin:44px auto 0;width:430px;position:relative}
.bwrap img{width:430px;display:block;border-radius:24px;filter:saturate(.92) drop-shadow(0 18px 22px rgba(120,80,50,.16))}
.bwrap::before{content:"";position:absolute;inset:0;border-radius:24px;z-index:2;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 55%,transparent 50%,rgba(251,237,231,.6) 80%,var(--peach1) 100%)}
.dcap{margin-top:44px;display:inline-flex;align-items:center;gap:16px;border-radius:44px;padding:15px 34px;
  background:linear-gradient(135deg,#D9B879 0%,var(--gold) 55%,#B98A4E 100%);box-shadow:0 10px 22px rgba(168,126,66,.35)}
.dcap .n{font-size:34px;font-weight:800;color:#fff}
.dcap .t{font-size:17px;color:#fff;letter-spacing:2px;font-weight:600}
</style></head><body><div class="wrap">
  <div class="brand">LUMIA <b>光研</b></div>
  <div class="pname">玻尿酸高保湿<br>精华水</div>
  <div class="pen">Hyaluronic Acid · Deep Moisture</div>
  <div class="tag">多维玻尿酸 · 立体储水 · 长效锁润</div>
  <div class="bwrap"><img src="bottle_wide.jpg"></div>
  <div class="dcap"><span class="n">24h</span><span class="t">持续水润 · 即时保湿</span></div>
</div></body></html>
